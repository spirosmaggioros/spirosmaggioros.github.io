short_bio: >-
  <p>
   I'm Spiros Maggioros, a Machine Learning Researcher at CBICA, Penn Medicine and also a final year undergraduate student of electrical & computer 
   engineering at NTUA. I spend most of my time implementing and training 3D Deep Learning models for brain imaging. I'm also interested in generic machine learning/computer vision 
   algorithms and optimization, contributing to many open source projects over the years.
  </p>
  <p>
    The last two years i'm part of NiChart, a cloud-based application for neuroimaging research that provide wide access to many tools that we develop in CBICA. The NiChart project is 
    supported, in part, by <b> NIH grants U24NS130411 and RF1AG054409 <b> and the cloud implementation is also supported by <b> Amazon Web Services (AWS) <b>. On NiChart, you can find all of 
    my models including Brain2Vec, DeepSPARE-BA and all derived models.
  </p>

